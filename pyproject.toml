[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warhammer-archive"
version = "0.1.2"
description = "Local-first PDF library auditor and research assistant foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=1.24,<2",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.8,<7",
]
build = [
    "PyInstaller>=6.14,<7",
]

[project.scripts]
warhammer-archive = "warhammer_archive.cli:main"
warhammer-archive-gui = "warhammer_archive.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
